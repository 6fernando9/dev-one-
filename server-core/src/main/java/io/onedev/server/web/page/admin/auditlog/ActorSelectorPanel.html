<wicket:panel>
	<div class="actor-selector p-4">
		<div class="d-flex align-items-center mb-3">
			<div class="position-relative flex-grow-1">
				<input wicket:id="search" class="form-control form-control-sm" t:placeholder="Search actor"></input>
				<wicket:svg href="magnify" class="icon text-muted icon-magnify"></wicket:svg>
			</div>
		</div>
		<ul wicket:id="actors" class="list-unstyled actors overflow-auto mb-0">
			<li wicket:id="actors" class="actor selectable">
				<a wicket:id="link">
					<img wicket:id="avatar" class="mr-1"> <span wicket:id="name"></span>
				</a>
			</li>
		</ul>
		<div wicket:id="noActors" class="no-actors mb-0 mt-4">
			<div class="alert alert-notice alert-light-warning">No actors found</div>
		</div>
	</div>
</wicket:panel>
