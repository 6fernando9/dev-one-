services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scm_dev
    restart: always
    ports:
      - "6610:6610"
    volumes:
      scm_data:
        -  name: onedev_scm_data_persistent
    networks:
      - scm_net

networks:
  scm_net:
    driver: bridge

volumes:
  scm_data: